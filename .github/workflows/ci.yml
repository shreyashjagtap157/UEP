name: UEP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres_version: ['17.11', '18.4']
    env:
      UEP_CI_DB_PASSWORD: ${{ format('uep-ci-{0}-{1}', github.run_id, github.run_attempt) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres_version }}
        env:
          POSTGRES_DB: education_platform
          POSTGRES_USER: education
          POSTGRES_PASSWORD: ${{ format('uep-ci-{0}-{1}', github.run_id, github.run_attempt) }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U education -d education_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify backend
        env:
          SUPABASE_DB_URL: jdbc:postgresql://localhost:5432/education_platform
          SUPABASE_DB_USER: education
          SUPABASE_DB_PASS: ${{ env.UEP_CI_DB_PASSWORD }}
          OIDC_ISSUER_URI: http://localhost:18081/realms/education
          OIDC_JWK_SET_URI: http://localhost:18081/realms/education/protocol/openid-connect/certs
          PLATFORM_DEV_MODE: "false"
        run: mvn -B -f apps/platform-server/pom.xml verify
      - name: Verify UUIDv7 migration callback on PostgreSQL ${{ matrix.postgres_version }}
        env:
          PGPASSWORD: ${{ env.UEP_CI_DB_PASSWORD }}
        run: |
          set -euo pipefail
          psql "postgresql://education@localhost:5432/education_platform" -X -v ON_ERROR_STOP=1 -f apps/platform-server/src/main/resources/db/migration/beforeMigrate.sql
          psql "postgresql://education@localhost:5432/education_platform" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE generated uuid := public.uuidv7();
          BEGIN
            IF substring(generated::text, 15, 1) <> '7' THEN
              RAISE EXCEPTION 'UUIDv7 version nibble is incorrect: %', generated;
            END IF;
            IF substring(generated::text, 20, 1) NOT IN ('8', '9', 'a', 'b') THEN
              RAISE EXCEPTION 'UUID RFC 4122 variant is incorrect: %', generated;
            END IF;
          END $$;
          SQL
      - name: Build Vercel backend container image
        run: docker build --pull --tag uep-platform-api:ci apps/platform-server
      - name: Start packaged server on a fresh database and run health smoke
        env:
          SUPABASE_DB_URL: jdbc:postgresql://localhost:5432/education_platform_smoke
          SUPABASE_DB_USER: education
          SUPABASE_DB_PASS: ${{ env.UEP_CI_DB_PASSWORD }}
          OIDC_ISSUER_URI: http://localhost:18081/realms/education
          OIDC_JWK_SET_URI: http://localhost:18081/realms/education/protocol/openid-connect/certs
          PLATFORM_RECORDING_PLAYBACK_SECRET: "uep-ci-recording-playback-secret-2026-11-01"
          PLATFORM_INTEGRATION_SECRET_KEY: "uep-ci-integration-secret-key-2026-11-01"
          LIVEKIT_API_KEY: "uep-ci-livekit-key-2026"
          LIVEKIT_API_SECRET: "uep-ci-livekit-api-secret-2026-11-01"
          PLATFORM_DEV_MODE: "false"
        run: |
          set -euo pipefail
          PGPASSWORD="$UEP_CI_DB_PASSWORD" psql "postgresql://education@localhost:5432/postgres" -X -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE education_platform_smoke OWNER education;"
          jar="apps/platform-server/target/platform-server-0.15.0.0-SNAPSHOT.jar"
          test -f "$jar"
          java -jar "$jar" > /tmp/uep-platform-server.log 2>&1 &
          app_pid=$!
          cleanup() {
            kill "$app_pid" 2>/dev/null || true
            wait "$app_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8080/actuator/health >/tmp/uep-health.json; then
              ready=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat /tmp/uep-platform-server.log
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            tail -n 200 /tmp/uep-platform-server.log
            echo "Packaged server did not become healthy in 120 seconds" >&2
            exit 1
          fi
          python3 scripts/load-smoke.py http://localhost:8080/actuator/health 30 6 2500 4000

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
      - name: Install
        run: npm --prefix apps/web install --ignore-scripts
      - name: Lint
        run: npm --prefix apps/web run lint
      - name: Demo workflow tests
        run: npm --prefix apps/web test
      - name: Build
        run: npm --prefix apps/web run build

  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify repository policy
        run: bash scripts/verify-repository.sh
      - name: Verify Vercel deployment contract
        run: python3 scripts/verify-vercel-config.py
      - name: Test backup/restore safety guards
        run: bash scripts/test-backup-restore-drill.sh
      - name: Test load-smoke percentile and latency checks
        run: python3 scripts/test-load-smoke.py
      - name: Qualify 0.15 reliability and security contracts
        run: python3 scripts/qualify-0.15.py

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
      - name: Resolve web lock metadata without install scripts
        run: npm --prefix apps/web install --package-lock-only --ignore-scripts
      - name: Generate Java dependency SBOM
        run: >-
          mvn -B -f apps/platform-server/pom.xml
          org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom
          -DoutputFormat=json
          -DoutputName=bom
          -DincludeTestScope=true
      - name: OSV source dependency scan
        run: >-
          docker run --rm
          -v "$PWD:/src"
          ghcr.io/google/osv-scanner:v2.4.0
          scan source
          --lockfile=/src/apps/web/package-lock.json
          --lockfile=/src/apps/platform-server/target/bom.json


  keycloak-staging-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate staging Keycloak realm and Fly configuration
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          realm = json.loads(Path("infra/keycloak/education-realm-staging.json").read_text())
          client = next(item for item in realm["clients"] if item["clientId"] == "platform-web")
          assert realm["realm"] == "education"
          assert client["publicClient"] is True
          assert client["standardFlowEnabled"] is True
          assert client["implicitFlowEnabled"] is False
          assert client["directAccessGrantsEnabled"] is False
          assert client["attributes"]["pkce.code.challenge.method"] == "S256"
          assert client["redirectUris"] == ["https://uep-frontend-testing.pages.dev/*"]
          assert client["webOrigins"] == ["https://uep-frontend-testing.pages.dev"]
          assert "localhost" not in json.dumps(client)
          fly = tomllib.loads(Path("infra/keycloak/fly.toml").read_text())
          assert fly["app"] == "uep-keycloak-testing"
          assert fly["primary_region"] == "syd"
          assert fly["http_service"]["internal_port"] == 8080
          assert fly["env"]["KC_DB"] == "postgres"
          assert fly["env"]["KC_DB_SCHEMA"] == "keycloak"
          assert fly["env"]["KC_PROXY_HEADERS"] == "xforwarded"
          assert fly["checks"][0]["port"] == 9000
          print("Staging Keycloak realm and Fly configuration passed.")
          PY
      - name: Build optimized staging Keycloak image
        run: docker build --pull --tag uep-keycloak-staging:ci infra/keycloak
