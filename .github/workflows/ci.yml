name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: education_platform
          POSTGRES_USER: education
          POSTGRES_PASSWORD: education
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U education -d education_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/education_platform
          DATABASE_USERNAME: education
          DATABASE_PASSWORD: education
          OIDC_ISSUER_URI: http://localhost:18081/realms/education
        run: mvn -B -f apps/platform-server/pom.xml verify

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm --prefix apps/web ci
      - name: Lint
        run: npm --prefix apps/web run lint
      - name: Build
        run: npm --prefix apps/web run build

  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository policy
        run: bash scripts/verify-repository.sh
