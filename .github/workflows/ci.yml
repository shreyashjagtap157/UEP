name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: education_platform
          POSTGRES_USER: education
          POSTGRES_PASSWORD: education
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U education -d education_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify backend
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/education_platform
          DATABASE_USERNAME: education
          DATABASE_PASSWORD: education
          OIDC_ISSUER_URI: http://localhost:18081/realms/education
          OIDC_JWK_SET_URI: http://localhost:18081/realms/education/protocol/openid-connect/certs
        run: mvn -B -f apps/platform-server/pom.xml verify

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Install
        run: npm --prefix apps/web install --ignore-scripts
      - name: Lint
        run: npm --prefix apps/web run lint
      - name: Build
        run: npm --prefix apps/web run build

  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository policy
        run: bash scripts/verify-repository.sh

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.16.0'
      - name: Resolve web lock metadata without install scripts
        run: npm --prefix apps/web install --package-lock-only --ignore-scripts
      - name: OSV source dependency scan
        run: >-
          docker run --rm
          -v "$PWD:/src"
          ghcr.io/google/osv-scanner:v2.4.0
          scan source --recursive /src
