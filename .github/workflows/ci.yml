name: UEP CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres_version: ['17.11', '18.4']
    env:
      UEP_CI_DB_PASSWORD: ${{ format('uep-ci-{0}-{1}', github.run_id, github.run_attempt) }}
    services:
      postgres:
        image: postgres:${{ matrix.postgres_version }}
        env:
          POSTGRES_DB: education_platform
          POSTGRES_USER: education
          POSTGRES_PASSWORD: ${{ format('uep-ci-{0}-{1}', github.run_id, github.run_attempt) }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U education -d education_platform"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify backend
        env:
          SUPABASE_DB_URL: jdbc:postgresql://localhost:5432/education_platform
          SUPABASE_DB_USER: education
          SUPABASE_DB_PASS: ${{ env.UEP_CI_DB_PASSWORD }}
          OIDC_ISSUER_URI: https://identity.example.test/realms/education
          OIDC_JWK_SET_URI: https://identity.example.test/realms/education/protocol/openid-connect/certs
          PLATFORM_DEV_MODE: "false"
        run: mvn -B -f apps/platform-server/pom.xml verify
      - name: Verify UUIDv7 migration callback on PostgreSQL ${{ matrix.postgres_version }}
        env:
          PGPASSWORD: ${{ env.UEP_CI_DB_PASSWORD }}
        run: |
          set -euo pipefail
          psql "postgresql://education@localhost:5432/education_platform" -X -v ON_ERROR_STOP=1 -f apps/platform-server/src/main/resources/db/migration/beforeMigrate.sql
          psql "postgresql://education@localhost:5432/education_platform" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $do$
          DECLARE
            generated uuid;
            unique_count integer;
            iteration integer;
          BEGIN
            FOR iteration IN 1..100 LOOP
              generated := public.uuidv7();
              IF substring(generated::text, 15, 1) <> '7' THEN
                RAISE EXCEPTION 'UUIDv7 version nibble is incorrect: %', generated;
              END IF;
              IF substring(generated::text, 20, 1) NOT IN ('8', '9', 'a', 'b') THEN
                RAISE EXCEPTION 'UUID RFC 9562 variant is incorrect: %', generated;
              END IF;
            END LOOP;

            SELECT count(DISTINCT public.uuidv7()) INTO unique_count
            FROM generate_series(1, 1000);
            IF unique_count <> 1000 THEN
              RAISE EXCEPTION 'UUIDv7 uniqueness probe failed: % unique values out of 1000', unique_count;
            END IF;
          END $do$;
          SQL
      - name: Verify least-privilege runtime database grants and function ACLs
        env:
          UEP_DATABASE_MIGRATION_JDBC_URL: jdbc:postgresql://localhost:5432/education_platform
          UEP_DATABASE_MIGRATION_USERNAME: education
          UEP_DATABASE_MIGRATION_PASSWORD: ${{ env.UEP_CI_DB_PASSWORD }}
          UEP_DATABASE_RUNTIME_USERNAME: uep_runtime_ci
          UEP_CI_RUNTIME_PASSWORD: ${{ format('uep-runtime-{0}-{1}', github.run_id, github.run_attempt) }}
          PGPASSWORD: ${{ env.UEP_CI_DB_PASSWORD }}
        run: |
          set -euo pipefail
          psql "postgresql://education@localhost:5432/education_platform" -X -v ON_ERROR_STOP=1 -v runtime_password="$UEP_CI_RUNTIME_PASSWORD" <<'SQL'
          CREATE ROLE uep_runtime_ci WITH LOGIN PASSWORD :'runtime_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;
          CREATE TYPE public.uep_ci_existing_type AS ENUM ('FIRST', 'SECOND');
          CREATE TABLE public.uep_ci_existing_probe (
            id uuid PRIMARY KEY DEFAULT public.uuidv7(),
            category public.uep_ci_existing_type NOT NULL,
            details text NOT NULL
          );
          CREATE FUNCTION public.uep_ci_existing_trigger_fn() RETURNS trigger
            LANGUAGE plpgsql AS $function$
            BEGIN NEW.details := NEW.details || '-triggered'; RETURN NEW; END;
            $function$;
          CREATE TRIGGER trg_uep_ci_existing_probe
            BEFORE INSERT ON public.uep_ci_existing_probe
            FOR EACH ROW EXECUTE FUNCTION public.uep_ci_existing_trigger_fn();
          CREATE FUNCTION public.uep_ci_existing_private_fn() RETURNS integer
            LANGUAGE sql AS $function$ SELECT 7 $function$;
          SQL
          mvn -B -f apps/platform-server/pom.xml org.codehaus.mojo:exec-maven-plugin:3.5.0:java
          psql "postgresql://education@localhost:5432/education_platform" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TYPE public.uep_ci_future_type AS ENUM ('FUTURE');
          CREATE TABLE public.uep_ci_future_probe (
            id uuid PRIMARY KEY DEFAULT public.uuidv7(),
            category public.uep_ci_future_type NOT NULL,
            details text NOT NULL
          );
          CREATE FUNCTION public.uep_ci_future_trigger_fn() RETURNS trigger
            LANGUAGE plpgsql AS $function$
            BEGIN NEW.details := NEW.details || '-triggered'; RETURN NEW; END;
            $function$;
          CREATE TRIGGER trg_uep_ci_future_probe
            BEFORE INSERT ON public.uep_ci_future_probe
            FOR EACH ROW EXECUTE FUNCTION public.uep_ci_future_trigger_fn();
          CREATE FUNCTION public.uep_ci_future_private_fn() RETURNS integer
            LANGUAGE sql AS $function$ SELECT 8 $function$;
          SQL
          PGPASSWORD="$UEP_CI_RUNTIME_PASSWORD" psql "postgresql://uep_runtime_ci@localhost:5432/education_platform" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $test$
          DECLARE
            existing_id uuid;
            future_id uuid;
            existing_count integer;
            future_count integer;
          BEGIN
            INSERT INTO public.uep_ci_existing_probe(category, details)
              VALUES ('FIRST', 'existing') RETURNING id INTO existing_id;
            INSERT INTO public.uep_ci_future_probe(category, details)
              VALUES ('FUTURE', 'future') RETURNING id INTO future_id;
            SELECT count(*) INTO existing_count FROM public.uep_ci_existing_probe
              WHERE id = existing_id AND details = 'existing-triggered';
            SELECT count(*) INTO future_count FROM public.uep_ci_future_probe
              WHERE id = future_id AND details = 'future-triggered';
            IF existing_count <> 1 OR future_count <> 1 THEN
              RAISE EXCEPTION 'Runtime DML or trigger-backed writes failed: %, %', existing_count, future_count;
            END IF;
            IF public.uuidv7() IS NULL THEN
              RAISE EXCEPTION 'Runtime UUIDv7 function access failed';
            END IF;
          END $test$;
          SQL
          if PGPASSWORD="$UEP_CI_RUNTIME_PASSWORD" psql "postgresql://uep_runtime_ci@localhost:5432/education_platform" -X -v ON_ERROR_STOP=1 -c 'CREATE TABLE public.uep_runtime_forbidden (id integer)' >/dev/null 2>&1; then
            echo "Runtime role unexpectedly has CREATE on the public schema." >&2
            exit 1
          fi
          if PGPASSWORD="$UEP_CI_RUNTIME_PASSWORD" psql "postgresql://uep_runtime_ci@localhost:5432/education_platform" -X -v ON_ERROR_STOP=1 -c 'SELECT count(*) FROM public.flyway_schema_history' >/dev/null 2>&1; then
            echo "Runtime role unexpectedly has access to Flyway schema history." >&2
            exit 1
          fi
          for function in uep_ci_existing_private_fn uep_ci_future_private_fn; do
            if PGPASSWORD="$UEP_CI_RUNTIME_PASSWORD" psql "postgresql://uep_runtime_ci@localhost:5432/education_platform" -X -v ON_ERROR_STOP=1 -c "SELECT public.$function()" >/dev/null 2>&1; then
              echo "Runtime role unexpectedly has EXECUTE on public.$function." >&2
              exit 1
            fi
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build API container image for the current runner architecture
        run: docker build --pull --tag uep-platform-api:ci apps/platform-server
      - name: Build and smoke-test OCI ARM64 API container image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 --load --tag uep-platform-api:arm64-ci apps/platform-server
          docker run --rm --platform linux/arm64 --entrypoint java uep-platform-api:arm64-ci -version
      - name: Start packaged server on a fresh database and run health smoke
        env:
          SUPABASE_DB_URL: jdbc:postgresql://localhost:5432/education_platform_smoke
          SUPABASE_DB_USER: education
          SUPABASE_DB_PASS: ${{ env.UEP_CI_DB_PASSWORD }}
          OIDC_ISSUER_URI: https://identity.example.test/realms/education
          OIDC_JWK_SET_URI: https://identity.example.test/realms/education/protocol/openid-connect/certs
          PLATFORM_RECORDING_PLAYBACK_SECRET: "uep-ci-recording-playback-secret-2026-11-01"
          PLATFORM_INTEGRATION_SECRET_KEY: "uep-ci-integration-secret-key-2026-11-01"
          LIVEKIT_API_KEY: "uep-ci-livekit-key-2026"
          LIVEKIT_API_SECRET: "uep-ci-livekit-api-secret-2026-11-01"
          PLATFORM_DEV_MODE: "false"
          # Mirror the Fly production profile. Fly disables automatic runtime
          # migrations; CI enables Flyway only for its disposable smoke database.
          SPRING_PROFILES_ACTIVE: production
          SPRING_FLYWAY_ENABLED: "true"
          PLATFORM_BACKGROUND_WORKERS_ENABLED: "true"
          PLATFORM_LIVEKIT_ENABLED: "false"
          PLATFORM_UPLOAD_STAGING_ENABLED: "false"
          PLATFORM_CLAMAV_ENABLED: "false"
        run: |
          set -euo pipefail
          PGPASSWORD="$UEP_CI_DB_PASSWORD" psql "postgresql://education@localhost:5432/postgres" -X -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE education_platform_smoke OWNER education;"
          container="uep-platform-api-smoke"
          docker rm --force "$container" >/dev/null 2>&1 || true
          cleanup() {
            docker logs --tail 200 "$container" >/tmp/uep-platform-server.log 2>&1 || true
            docker rm --force "$container" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name "$container" --network host \
            --env SUPABASE_DB_URL \
            --env SUPABASE_DB_USER \
            --env SUPABASE_DB_PASS \
            --env OIDC_ISSUER_URI \
            --env OIDC_JWK_SET_URI \
            --env PLATFORM_RECORDING_PLAYBACK_SECRET \
            --env PLATFORM_INTEGRATION_SECRET_KEY \
            --env LIVEKIT_API_KEY \
            --env LIVEKIT_API_SECRET \
            --env PLATFORM_DEV_MODE \
            --env SPRING_PROFILES_ACTIVE \
            --env SPRING_FLYWAY_ENABLED \
            --env PLATFORM_BACKGROUND_WORKERS_ENABLED \
            --env PLATFORM_LIVEKIT_ENABLED \
            --env PLATFORM_UPLOAD_STAGING_ENABLED \
            --env PLATFORM_CLAMAV_ENABLED \
            uep-platform-api:ci
          configured_user="$(docker inspect --format '{{.Config.User}}' "$container")"
          if [ "$configured_user" != "10001:10001" ]; then
            docker logs "$container" || true
            echo "API runtime container must run as UID/GID 10001." >&2
            exit 1
          fi
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error http://localhost:8080/actuator/health >/tmp/uep-health.json; then
              ready=true
              break
            fi
            running="$(docker inspect --format '{{.State.Running}}' "$container" 2>/dev/null || true)"
            if [ "$running" != "true" ]; then
              docker logs "$container" || true
              echo "Production API container exited before becoming healthy." >&2
              exit 1
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            docker logs --tail 200 "$container"
            echo "Packaged production-profile container did not become healthy in 120 seconds" >&2
            exit 1
          fi
          echo "Packaged production-profile container startup log (last 120 lines):"
          docker logs --tail 120 "$container"
          python3 scripts/load-smoke.py http://localhost:8080/actuator/health 30 6 2500 4000

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
      - name: Install locked web dependencies
        run: npm --prefix apps/web ci --ignore-scripts
      - name: Lint
        run: npm --prefix apps/web run lint
      - name: Demo workflow tests
        run: npm --prefix apps/web test
      - name: Build with the real OIDC production contract
        env:
          VITE_LOCAL_MODE: "false"
          VITE_KEYCLOAK_URL: https://identity.example.invalid
          VITE_KEYCLOAK_REALM: education
          VITE_KEYCLOAK_CLIENT_ID: platform-web
        run: npm --prefix apps/web run build:production

  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify repository policy
        run: bash scripts/verify-repository.sh
      - name: Parse native PowerShell launcher
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'scripts/Start-UEP.ps1'),
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }
          Write-Host 'Native Windows launcher PowerShell syntax passed.'
      - name: Verify local-only deployment boundary
        run: python3 scripts/verify-local-deployment-boundary.py
      - name: Test backup/restore safety guards
        run: bash scripts/test-backup-restore-drill.sh
      - name: Test load-smoke percentile and latency checks
        run: python3 scripts/test-load-smoke.py
      - name: Qualify 0.15 reliability and security contracts
        run: python3 scripts/qualify-0.15.py

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.22.0'
      - name: Install locked web dependencies for vulnerability scanning
        run: npm --prefix apps/web ci --ignore-scripts
      - name: Generate Java dependency SBOM
        run: >-
          mvn -B -f apps/platform-server/pom.xml
          org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeBom
          -DoutputFormat=json
          -DoutputName=bom
          -DincludeTestScope=true
      - name: OSV source dependency scan
        run: >-
          docker run --rm
          -v "$PWD:/src"
          ghcr.io/google/osv-scanner:v2.4.0
          scan source
          --lockfile=/src/apps/web/package-lock.json
          --lockfile=/src/apps/platform-server/target/bom.json


  keycloak-staging-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Keycloak realm and OCI container contract
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          realm = json.loads(Path("infra/keycloak/education-realm-staging.json").read_text())
          client = next(item for item in realm["clients"] if item["clientId"] == "platform-web")
          assert realm["realm"] == "education"
          assert client["publicClient"] is True
          assert client["standardFlowEnabled"] is True
          assert client["implicitFlowEnabled"] is False
          assert client["directAccessGrantsEnabled"] is False
          assert client["attributes"]["pkce.code.challenge.method"] == "S256"
          assert client["redirectUris"] == ["https://uep-frontend-testing.pages.dev/*"]
          assert client["webOrigins"] == ["https://uep-frontend-testing.pages.dev"]
          assert "localhost" not in json.dumps(client)

          api_dockerfile = Path("apps/platform-server/Dockerfile").read_text()
          assert "eclipse-temurin:21-jre" in api_dockerfile
          assert "USER 10001:10001" in api_dockerfile
          oci_profile = Path("apps/platform-server/src/main/resources/application-oci.yaml").read_text()
          assert "flyway:" in oci_profile and "enabled: false" in oci_profile
          migration_runner = Path("apps/platform-server/src/main/java/com/universalplatform/DatabaseMigrationRunner.java").read_text()
          for required in (
              "UEP_DATABASE_MIGRATION_JDBC_URL",
              "UEP_DATABASE_MIGRATION_USERNAME",
              "UEP_DATABASE_MIGRATION_PASSWORD",
              "UEP_DATABASE_RUNTIME_USERNAME",
              "validateRuntimeRole",
          ):
              assert required in migration_runner

          keycloak_dockerfile = Path("infra/keycloak/Dockerfile").read_text()
          assert "quay.io/keycloak/keycloak:26.7.0" in keycloak_dockerfile
          assert 'CMD ["start", "--optimized", "--import-realm"]' in keycloak_dockerfile
          print("Keycloak realm and OCI container contract passed.")
          PY
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build optimized staging Keycloak image for the current runner
        run: docker build --pull --tag uep-keycloak-staging:ci infra/keycloak
      - name: Build and smoke-test OCI ARM64 Keycloak image
        run: |
          set -euo pipefail
          docker buildx build --platform linux/arm64 --load --tag uep-keycloak-staging:arm64-ci infra/keycloak
          docker run --rm --platform linux/arm64 --entrypoint java uep-keycloak-staging:arm64-ci -version
