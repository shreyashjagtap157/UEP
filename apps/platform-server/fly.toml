app = 'uep-backend-testing'
primary_region = 'syd'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  # Shared-CPU startup exceeds Fly's idle-stop window, so keep a warm machine.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
