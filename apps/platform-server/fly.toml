# UEP Spring Boot staging API — Cloudflare Pages frontend, Supabase PostgreSQL database.
# Start/reuse this app only after inspecting the live Fly account and approving its regional cost.
app = 'uep-backend-testing'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  SPRING_PROFILES_ACTIVE = 'production'
  SPRING_FLYWAY_ENABLED = 'false'
  PLATFORM_DEV_MODE = 'false'
  PLATFORM_BACKGROUND_WORKERS_ENABLED = 'true'
  PLATFORM_LIVEKIT_ENABLED = 'false'
  PLATFORM_UPLOAD_STAGING_ENABLED = 'false'
  PLATFORM_MAX_UPLOAD_BYTES = '52428800'
  PLATFORM_CLAMAV_ENABLED = 'false'
  OIDC_ISSUER_URI = 'https://uep-keycloak-testing.fly.dev/realms/education'
  OIDC_JWK_SET_URI = 'https://uep-keycloak-testing.fly.dev/realms/education/protocol/openid-connect/certs'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[http_service.checks]]
  grace_period = '90s'
  interval = '15s'
  method = 'GET'
  path = '/actuator/health'
  timeout = '5s'

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 2048
