server:
  shutdown: graceful
  address: 0.0.0.0
  port: 8080
  error:
    include-message: never

spring:
  application:
    name: universal-education-platform
  jackson:
    deserialization:
      # Preserve existing API behavior: omitted primitive request fields use Java defaults.
      fail-on-null-for-primitives: false
  datasource:
    url: ${SUPABASE_DB_URL:}
    username: ${SUPABASE_DB_USER}
    password: ${SUPABASE_DB_PASS}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:20}
      minimum-idle: ${DATABASE_MIN_IDLE:2}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:1000}
      leak-detection-threshold: ${DATABASE_LEAK_DETECTION_MS:0}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          default_schema: public
          eclipse:
            namespace: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    baseline-version: 0
    locations: classpath:db/migration
    schemas: public
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/education}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/education/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  health:
    # The optional mail transport should not fail aggregate health while delivery is disabled.
    # Once email delivery is enabled, verify SMTP reachability as part of readiness.
    mail:
      enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}

platform:
  version: 0.15.0.0-SNAPSHOT
  staging:
    database-identity:
      enabled: ${PLATFORM_STAGING_DATABASE_IDENTITY_ENABLED:false}
      expected-host: ${PLATFORM_STAGING_EXPECTED_DB_HOST:}
      expected-database: ${PLATFORM_STAGING_EXPECTED_DB_NAME:}
  # Explicit opt-out of the production-secret guard (ProductionSecretGuard) for local dev and CI.
  development-mode: ${PLATFORM_DEV_MODE:false}
  storage:
    upload-cleanup-poll-ms: ${PLATFORM_UPLOAD_CLEANUP_POLL_MS:3600000}
    retention-poll-ms: ${PLATFORM_CONTENT_RETENTION_POLL_MS:3600000}
    max-upload-bytes: ${PLATFORM_MAX_UPLOAD_BYTES:5368709120}
    email:
      enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
      poll-ms: ${NOTIFICATION_EMAIL_POLL_MS:2000}
      from: ${NOTIFICATION_EMAIL_FROM:no-reply@localhost}
  announcements:
    publish-poll-ms: ${ANNOUNCEMENT_PUBLISH_POLL_MS:1000}
    expiry-poll-ms: ${ANNOUNCEMENT_EXPIRY_POLL_MS:60000}
  live-learning:
    livekit:
      url: ${LIVEKIT_URL:ws://localhost:7880}
      api-url: ${LIVEKIT_API_URL:http://localhost:7880}
      api-key: ${LIVEKIT_API_KEY:devkey}
      api-secret: ${LIVEKIT_API_SECRET:secret}
    heartbeat-timeout-seconds: ${LIVE_CLASS_HEARTBEAT_TIMEOUT_SECONDS:90}

  malware-scan:
    clamav:
      enabled: ${PLATFORM_CLAMAV_ENABLED:false}
      host: ${PLATFORM_CLAMAV_HOST:localhost}
      port: ${PLATFORM_CLAMAV_PORT:3310}

  messaging:
    retention-poll-ms: ${PLATFORM_MESSAGE_RETENTION_POLL_MS:3600000}

  recording:
    worker-poll-ms: ${RECORDING_WORKER_POLL_MS:2000}
    archive-poll-ms: ${RECORDING_ARCHIVE_POLL_MS:60000}
    retention-poll-ms: ${RECORDING_RETENTION_POLL_MS:3600000}
    processing-root: ${PLATFORM_RECORDING_PROCESSING_ROOT:./var/recordings}
    playback-secret: ${PLATFORM_RECORDING_PLAYBACK_SECRET:change-me-in-production}
    ffmpeg-command: ${PLATFORM_RECORDING_FFMPEG:ffmpeg}

  integrations:
    secret-key: ${PLATFORM_INTEGRATION_SECRET_KEY:change-me-in-production}
    webhooks:
      poll-ms: ${PLATFORM_WEBHOOK_POLL_MS:2000}