server:
  shutdown: graceful
  error:
    include-message: never

spring:
  application:
    name: universal-education-platform
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/education_platform}
    username: ${DATABASE_USERNAME:education}
    password: ${DATABASE_PASSWORD:education}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
      minimum-idle: 1
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/education}
          jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8081/realms/education/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
  observations:
    key-values:
      application: ${spring.application.name}

platform:
  version: 0.7.0.0-SNAPSHOT
  notifications:
    outbox-poll-ms: ${NOTIFICATION_OUTBOX_POLL_MS:1000}
    email:
      enabled: ${EMAIL_NOTIFICATIONS_ENABLED:false}
      poll-ms: ${NOTIFICATION_EMAIL_POLL_MS:2000}
      from: ${NOTIFICATION_EMAIL_FROM:no-reply@localhost}
  announcements:
    publish-poll-ms: ${ANNOUNCEMENT_PUBLISH_POLL_MS:1000}
    expiry-poll-ms: ${ANNOUNCEMENT_EXPIRY_POLL_MS:60000}
  storage:
    upload-cleanup-poll-ms: ${PLATFORM_UPLOAD_CLEANUP_POLL_MS:3600000}
    retention-poll-ms: ${PLATFORM_CONTENT_RETENTION_POLL_MS:3600000}
    staging:
      root: ${PLATFORM_UPLOAD_STAGING:./var/uploads}
    local:
      root: ${PLATFORM_LOCAL_STORAGE:./var/storage}
    s3:
      enabled: ${PLATFORM_S3_ENABLED:false}
      endpoint: ${PLATFORM_S3_ENDPOINT:http://localhost:9000}
      region: ${PLATFORM_S3_REGION:us-east-1}
      access-key: ${PLATFORM_S3_ACCESS_KEY:}
      secret-key: ${PLATFORM_S3_SECRET_KEY:}
      bucket: ${PLATFORM_S3_BUCKET:learning-content}
    google-drive:
      enabled: ${PLATFORM_GOOGLE_DRIVE_ENABLED:false}
      access-token: ${PLATFORM_GOOGLE_DRIVE_ACCESS_TOKEN:}
      folder-id: ${PLATFORM_GOOGLE_DRIVE_FOLDER_ID:}
      shared-drive-id: ${PLATFORM_GOOGLE_SHARED_DRIVE_ID:}
    malware-scan:
      clamav:
        enabled: ${PLATFORM_CLAMAV_ENABLED:false}
        host: ${PLATFORM_CLAMAV_HOST:localhost}
        port: ${PLATFORM_CLAMAV_PORT:3310}
