openapi: 3.1.0
info:
  title: Universal Education Platform API
  version: 0.2.0.0-SNAPSHOT
  description: Web-first, tenant-authoritative platform API.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /platform/version:
    get:
      security: []
      summary: Read platform build/version information
      operationId: getPlatformVersion
      responses:
        '200': { description: Platform version, content: { application/json: { schema: { $ref: '#/components/schemas/PlatformVersion' } } } }
  /me:
    get:
      summary: Read current tenant identity, roles, permissions, and authentication assurance
      operationId: getCurrentIdentity
      responses:
        '200': { description: Current identity, content: { application/json: { schema: { $ref: '#/components/schemas/CurrentIdentity' } } } }
        '401': { description: Unauthenticated }
        '403': { description: Missing/inactive tenant membership or revoked session }
  /identity/bootstrap-owner:
    post:
      summary: Bootstrap the first tenant owner; platform-super-administrator only
      operationId: bootstrapOwner
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProvisionMembershipRequest' } } } }
      responses:
        '200': { description: Created owner membership, content: { application/json: { schema: { $ref: '#/components/schemas/MemberView' } } } }
        '403': { description: Platform super administrator required }
        '409': { description: Tenant is already bootstrapped }
  /identity/memberships:
    get:
      summary: List tenant memberships
      operationId: listMemberships
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Membership page, content: { application/json: { schema: { $ref: '#/components/schemas/MemberPage' } } } }
    post:
      summary: Provision a tenant membership
      operationId: provisionMembership
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/ProvisionMembershipRequest' } } } }
      responses:
        '200': { description: Membership, content: { application/json: { schema: { $ref: '#/components/schemas/MemberView' } } } }
  /identity/memberships/{membershipId}:
    parameters:
      - { $ref: '#/components/parameters/MembershipId' }
    get:
      summary: Read a tenant membership
      operationId: getMembership
      responses:
        '200': { description: Membership, content: { application/json: { schema: { $ref: '#/components/schemas/MemberView' } } } }
        '404': { description: Membership not found in current tenant }
    patch:
      summary: Update membership state and tenant-local metadata
      operationId: updateMembership
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateMembershipRequest' } } } }
      responses:
        '200': { description: Membership, content: { application/json: { schema: { $ref: '#/components/schemas/MemberView' } } } }
        '409': { description: Concurrent modification or last-owner invariant }
  /identity/roles:
    get:
      summary: List tenant roles
      operationId: listRoles
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Role page, content: { application/json: { schema: { $ref: '#/components/schemas/RolePage' } } } }
    post:
      summary: Create a custom role
      operationId: createCustomRole
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleRequest' } } } }
      responses:
        '200': { description: Role, content: { application/json: { schema: { $ref: '#/components/schemas/RoleView' } } } }
        '409': { description: Duplicate role }
  /identity/roles/{roleId}:
    parameters:
      - { name: roleId, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      summary: Update a custom role
      operationId: updateCustomRole
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RoleRequest' } } } }
      responses:
        '200': { description: Role, content: { application/json: { schema: { $ref: '#/components/schemas/RoleView' } } } }
        '409': { description: System role, duplicate role, or concurrent modification }
    delete:
      summary: Delete an unassigned custom role
      operationId: deleteCustomRole
      responses:
        '204': { description: Deleted }
        '409': { description: System-managed or assigned role }
  /identity/roles/memberships/{membershipId}:
    get:
      summary: List role assignments for a membership
      operationId: listRoleAssignments
      parameters:
        - { $ref: '#/components/parameters/MembershipId' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Assignment page, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentPage' } } } }
  /identity/roles/assignments:
    post:
      summary: Assign a tenant or branch-scoped role
      operationId: assignRole
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentRequest' } } } }
      responses:
        '200': { description: Assignment, content: { application/json: { schema: { $ref: '#/components/schemas/AssignmentView' } } } }
  /identity/roles/assignments/{assignmentId}:
    delete:
      summary: Remove a role assignment
      operationId: unassignRole
      parameters:
        - { name: assignmentId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed }
        '409': { description: Last active organization owner cannot be removed }
  /identity/sessions/me:
    get:
      summary: List current member's observed platform sessions
      operationId: listOwnSessions
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Session page, content: { application/json: { schema: { $ref: '#/components/schemas/SessionPage' } } } }
  /identity/sessions/me/{sessionId}:
    delete:
      summary: Revoke one of the current member's platform sessions
      operationId: revokeOwnSession
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/RevokeSessionRequest' } } } }
      responses:
        '204': { description: Revoked }
  /identity/sessions/memberships/{membershipId}:
    get:
      summary: List observed sessions for a tenant membership
      operationId: listMemberSessions
      parameters:
        - { $ref: '#/components/parameters/MembershipId' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Session page, content: { application/json: { schema: { $ref: '#/components/schemas/SessionPage' } } } }
  /identity/sessions/{sessionId}:
    delete:
      summary: Administratively revoke a tenant member's platform session
      operationId: revokeMemberSession
      parameters:
        - { $ref: '#/components/parameters/SessionId' }
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/RevokeSessionRequest' } } } }
      responses:
        '204': { description: Revoked }
  /organization/branches:
    get:
      summary: List tenant branches
      operationId: listBranches
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200': { description: Branch page, content: { application/json: { schema: { $ref: '#/components/schemas/BranchPage' } } } }
    post:
      summary: Create a tenant branch
      operationId: createBranch
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BranchRequest' } } } }
      responses:
        '200': { description: Branch, content: { application/json: { schema: { $ref: '#/components/schemas/BranchView' } } } }
  /organization/branches/{branchId}:
    parameters:
      - { name: branchId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Read a tenant branch
      operationId: getBranch
      responses:
        '200': { description: Branch, content: { application/json: { schema: { $ref: '#/components/schemas/BranchView' } } } }
        '404': { description: Branch not found in current tenant }
    put:
      summary: Update a tenant branch with optimistic concurrency
      operationId: updateBranch
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/BranchRequest' } } } }
      responses:
        '200': { description: Branch, content: { application/json: { schema: { $ref: '#/components/schemas/BranchView' } } } }
        '409': { description: Concurrent modification or duplicate branch code }
  /organization/settings:
    get:
      summary: Read tenant organization defaults
      operationId: getOrganizationSettings
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationSettings' } } } }
    put:
      summary: Update tenant organization defaults with optimistic concurrency
      operationId: updateOrganizationSettings
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationSettingsUpdate' } } } }
      responses:
        '200': { description: Settings, content: { application/json: { schema: { $ref: '#/components/schemas/OrganizationSettings' } } } }
        '409': { description: Concurrent modification }
  /licensing/entitlements/{feature}/decision:
    get:
      summary: Resolve the current tenant entitlement decision
      operationId: getEntitlementDecision
      parameters:
        - in: path
          name: feature
          required: true
          schema: { $ref: '#/components/schemas/FeatureKey' }
      responses:
        '200': { description: Current decision, content: { application/json: { schema: { $ref: '#/components/schemas/EntitlementDecision' } } } }
        '401': { description: Unauthenticated }
        '403': { description: Missing tenant context, inactive membership, or forbidden }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    Size: { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
    MembershipId: { name: membershipId, in: path, required: true, schema: { type: string, format: uuid } }
    SessionId: { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    PlatformVersion:
      type: object
      required: [version, releaseStatus]
      properties: { version: { type: string }, releaseStatus: { type: string } }
    PermissionKey:
      type: string
      enum: [ORGANIZATION_VIEW, ORGANIZATION_MANAGE, BRANCHES_VIEW, BRANCHES_MANAGE, USERS_VIEW, USERS_MANAGE, ROLES_VIEW, ROLES_MANAGE, ROLES_ASSIGN, SESSIONS_VIEW, SESSIONS_MANAGE, AUDIT_VIEW]
    MembershipStatus: { type: string, enum: [ACTIVE, SUSPENDED, ENDED] }
    UserStatus: { type: string, enum: [ACTIVE, DISABLED] }
    AssignmentScopeKind: { type: string, enum: [TENANT, BRANCH] }
    AuthenticationAssurance:
      type: object
      required: [acr, methods, otpEvidence, webAuthnEvidence, multiFactorEvidence]
      properties:
        acr: { type: string }
        methods: { type: array, items: { type: string } }
        otpEvidence: { type: boolean }
        webAuthnEvidence: { type: boolean }
        multiFactorEvidence: { type: boolean }
    CurrentIdentity:
      type: object
      required: [userId, membershipId, oidcSubject, displayName, tenantId, membershipStatus, roles, permissions, authenticationAssurance]
      properties:
        userId: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        oidcSubject: { type: string }
        email: { type: [string, 'null'], format: email }
        displayName: { type: string }
        tenantId: { type: string, format: uuid }
        membershipStatus: { $ref: '#/components/schemas/MembershipStatus' }
        primaryBranchId: { type: [string, 'null'], format: uuid }
        roles: { type: array, items: { type: string } }
        permissions: { type: array, items: { $ref: '#/components/schemas/PermissionKey' } }
        authenticationAssurance: { $ref: '#/components/schemas/AuthenticationAssurance' }
    ProvisionMembershipRequest:
      type: object
      required: [subject, displayName]
      properties:
        subject: { type: string, maxLength: 160 }
        email: { type: string, format: email, maxLength: 320 }
        displayName: { type: string, maxLength: 200 }
        primaryBranchId: { type: string, format: uuid }
        externalReference: { type: string, maxLength: 160 }
        roleIds: { type: array, items: { type: string, format: uuid } }
    UpdateMembershipRequest:
      type: object
      required: [status, expectedVersion]
      properties:
        status: { $ref: '#/components/schemas/MembershipStatus' }
        primaryBranchId: { type: [string, 'null'], format: uuid }
        externalReference: { type: [string, 'null'], maxLength: 160 }
        expectedVersion: { type: integer, format: int64 }
    RoleReference:
      type: object
      required: [id, name, systemManaged]
      properties:
        id: { type: string, format: uuid }
        systemKey: { type: [string, 'null'] }
        name: { type: string }
        systemManaged: { type: boolean }
    MemberView:
      type: object
      required: [membershipId, userId, oidcSubject, displayName, userStatus, membershipStatus, joinedAt, roles, version]
      properties:
        membershipId: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        oidcSubject: { type: string }
        email: { type: [string, 'null'], format: email }
        displayName: { type: string }
        userStatus: { $ref: '#/components/schemas/UserStatus' }
        membershipStatus: { $ref: '#/components/schemas/MembershipStatus' }
        primaryBranchId: { type: [string, 'null'], format: uuid }
        externalReference: { type: [string, 'null'] }
        joinedAt: { type: string, format: date-time }
        roles: { type: array, items: { $ref: '#/components/schemas/RoleReference' } }
        version: { type: integer, format: int64 }
    RoleRequest:
      type: object
      required: [name, expectedVersion]
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 500 }
        permissions: { type: array, items: { $ref: '#/components/schemas/PermissionKey' } }
        expectedVersion: { type: integer, format: int64 }
    RoleView:
      type: object
      required: [id, name, systemManaged, permissions, version]
      properties:
        id: { type: string, format: uuid }
        systemKey: { type: [string, 'null'] }
        name: { type: string }
        description: { type: [string, 'null'] }
        systemManaged: { type: boolean }
        permissions: { type: array, items: { $ref: '#/components/schemas/PermissionKey' } }
        version: { type: integer, format: int64 }
    AssignmentRequest:
      type: object
      required: [membershipId, roleId, scopeKind]
      properties:
        membershipId: { type: string, format: uuid }
        roleId: { type: string, format: uuid }
        scopeKind: { $ref: '#/components/schemas/AssignmentScopeKind' }
        scopeId: { type: [string, 'null'], format: uuid }
    AssignmentView:
      type: object
      required: [id, membershipId, roleId, roleName, scopeKind]
      properties:
        id: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        roleId: { type: string, format: uuid }
        roleName: { type: string }
        scopeKind: { $ref: '#/components/schemas/AssignmentScopeKind' }
        scopeId: { type: [string, 'null'], format: uuid }
    SessionView:
      type: object
      required: [id, startedAt, lastSeenAt, current]
      properties:
        id: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        expiresAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        revocationReason: { type: [string, 'null'] }
        current: { type: boolean }
    RevokeSessionRequest:
      type: object
      properties: { reason: { type: string, maxLength: 500 } }
    BranchStatus: { type: string, enum: [ACTIVE, INACTIVE, CLOSED] }
    BranchRequest:
      type: object
      required: [code, displayName, timezone]
      properties:
        code: { type: string, maxLength: 64 }
        displayName: { type: string, maxLength: 200 }
        timezone: { type: string, maxLength: 80 }
        status: { $ref: '#/components/schemas/BranchStatus' }
        expectedVersion: { type: integer, format: int64, default: 0 }
    BranchView:
      type: object
      required: [id, code, displayName, timezone, status, createdAt, version]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        displayName: { type: string }
        timezone: { type: string }
        status: { $ref: '#/components/schemas/BranchStatus' }
        createdAt: { type: string, format: date-time }
        version: { type: integer, format: int64 }
    OrganizationSettings:
      type: object
      required: [tenantId, defaultTimezone, defaultLocale, weekStartsOn, version]
      properties:
        tenantId: { type: string, format: uuid }
        defaultTimezone: { type: string }
        defaultLocale: { type: string }
        weekStartsOn: { type: integer, minimum: 1, maximum: 7 }
        supportEmail: { type: [string, 'null'], format: email }
        supportUrl: { type: [string, 'null'], format: uri }
        version: { type: integer, format: int64 }
    OrganizationSettingsUpdate:
      type: object
      required: [defaultTimezone, defaultLocale, weekStartsOn, expectedVersion]
      properties:
        defaultTimezone: { type: string, maxLength: 80 }
        defaultLocale: { type: string, maxLength: 35 }
        weekStartsOn: { type: integer, minimum: 1, maximum: 7 }
        supportEmail: { type: [string, 'null'], format: email, maxLength: 320 }
        supportUrl: { type: [string, 'null'], format: uri, maxLength: 1000 }
        expectedVersion: { type: integer, format: int64 }
    MemberPage:
      allOf:
        - { $ref: '#/components/schemas/PageMetadata' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/MemberView' } } }
    RolePage:
      allOf:
        - { $ref: '#/components/schemas/PageMetadata' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/RoleView' } } }
    AssignmentPage:
      allOf:
        - { $ref: '#/components/schemas/PageMetadata' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/AssignmentView' } } }
    SessionPage:
      allOf:
        - { $ref: '#/components/schemas/PageMetadata' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/SessionView' } } }
    BranchPage:
      allOf:
        - { $ref: '#/components/schemas/PageMetadata' }
        - type: object
          properties: { items: { type: array, items: { $ref: '#/components/schemas/BranchView' } } }
    PageMetadata:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: { type: array, items: {} }
        page: { type: integer }
        size: { type: integer }
        totalElements: { type: integer, format: int64 }
        totalPages: { type: integer }
    FeatureKey:
      type: string
      enum: [LIVE_CLASS, RECORDING, ASSESSMENTS, AUTO_GRADING, ADVANCED_REVIEW, ASSIGNMENTS, PAYMENTS, CERTIFICATES, API, WHITE_LABEL, SSO, AI]
    EntitlementDecision:
      type: object
      required: [feature, allowed, reason]
      properties:
        feature: { $ref: '#/components/schemas/FeatureKey' }
        allowed: { type: boolean }
        reason: { type: string }
