openapi: 3.1.0
info:
  title: Universal Education Platform API
  version: 0.11.0.0-SNAPSHOT
  description: Web-first, tenant-authoritative platform API with live learning, attendance, recordings, finance and commercialization.
servers:
- url: /api/v1
security:
- bearerAuth: []
paths:
  /platform/version:
    get:
      security: []
      summary: Read platform build/version information
      operationId: getPlatformVersion
      responses:
        '200':
          description: Platform version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformVersion'
  /me:
    get:
      summary: Read current tenant identity, roles, permissions, and authentication assurance
      operationId: getCurrentIdentity
      responses:
        '200':
          description: Current identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentIdentity'
        '401':
          description: Unauthenticated
        '403':
          description: Missing/inactive tenant membership or revoked session
  /identity/bootstrap-owner:
    post:
      summary: Bootstrap the first tenant owner; platform-super-administrator only
      operationId: bootstrapOwner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionMembershipRequest'
      responses:
        '200':
          description: Created owner membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberView'
        '403':
          description: Platform super administrator required
        '409':
          description: Tenant is already bootstrapped
  /identity/memberships:
    get:
      summary: List tenant memberships
      operationId: listMemberships
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Membership page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberPage'
    post:
      summary: Provision a tenant membership
      operationId: provisionMembership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionMembershipRequest'
      responses:
        '200':
          description: Membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberView'
  /identity/memberships/{membershipId}:
    parameters:
    - $ref: '#/components/parameters/MembershipId'
    get:
      summary: Read a tenant membership
      operationId: getMembership
      responses:
        '200':
          description: Membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberView'
        '404':
          description: Membership not found in current tenant
    patch:
      summary: Update membership state and tenant-local metadata
      operationId: updateMembership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMembershipRequest'
      responses:
        '200':
          description: Membership
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberView'
        '409':
          description: Concurrent modification or last-owner invariant
  /identity/roles:
    get:
      summary: List tenant roles
      operationId: listRoles
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Role page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePage'
    post:
      summary: Create a custom role
      operationId: createCustomRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '200':
          description: Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleView'
        '409':
          description: Duplicate role
  /identity/roles/{roleId}:
    parameters:
    - name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    put:
      summary: Update a custom role
      operationId: updateCustomRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleRequest'
      responses:
        '200':
          description: Role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleView'
        '409':
          description: System role
          duplicate role: null
          or concurrent modification: null
    delete:
      summary: Delete an unassigned custom role
      operationId: deleteCustomRole
      responses:
        '204':
          description: Deleted
        '409':
          description: System-managed or assigned role
  /identity/roles/memberships/{membershipId}:
    get:
      summary: List role assignments for a membership
      operationId: listRoleAssignments
      parameters:
      - $ref: '#/components/parameters/MembershipId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Assignment page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentPage'
  /identity/roles/assignments:
    post:
      summary: Assign a tenant or branch-scoped role
      operationId: assignRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignmentRequest'
      responses:
        '200':
          description: Assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignmentView'
  /identity/roles/assignments/{assignmentId}:
    delete:
      summary: Remove a role assignment
      operationId: unassignRole
      parameters:
      - name: assignmentId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Removed
        '409':
          description: Last active organization owner cannot be removed
  /identity/sessions/me:
    get:
      summary: List current member's observed platform sessions
      operationId: listOwnSessions
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Session page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
  /identity/sessions/me/{sessionId}:
    delete:
      summary: Revoke one of the current member's platform sessions
      operationId: revokeOwnSession
      parameters:
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeSessionRequest'
      responses:
        '204':
          description: Revoked
  /identity/sessions/memberships/{membershipId}:
    get:
      summary: List observed sessions for a tenant membership
      operationId: listMemberSessions
      parameters:
      - $ref: '#/components/parameters/MembershipId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Session page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionPage'
  /identity/sessions/{sessionId}:
    delete:
      summary: Administratively revoke a tenant member's platform session
      operationId: revokeMemberSession
      parameters:
      - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeSessionRequest'
      responses:
        '204':
          description: Revoked
  /organization/branches:
    get:
      summary: List tenant branches
      operationId: listBranches
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Branch page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchPage'
    post:
      summary: Create a tenant branch
      operationId: createBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchRequest'
      responses:
        '200':
          description: Branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchView'
  /organization/branches/{branchId}:
    parameters:
    - name: branchId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      summary: Read a tenant branch
      operationId: getBranch
      responses:
        '200':
          description: Branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchView'
        '404':
          description: Branch not found in current tenant
    put:
      summary: Update a tenant branch with optimistic concurrency
      operationId: updateBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BranchRequest'
      responses:
        '200':
          description: Branch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BranchView'
        '409':
          description: Concurrent modification or duplicate branch code
  /organization/settings:
    get:
      summary: Read tenant organization defaults
      operationId: getOrganizationSettings
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSettings'
    put:
      summary: Update tenant organization defaults with optimistic concurrency
      operationId: updateOrganizationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationSettingsUpdate'
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSettings'
        '409':
          description: Concurrent modification
  /licensing/entitlements/{feature}/decision:
    get:
      summary: Resolve the current tenant entitlement decision
      operationId: getEntitlementDecision
      parameters:
      - in: path
        name: feature
        required: true
        schema:
          $ref: '#/components/schemas/FeatureKey'
      responses:
        '200':
          description: Current decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementDecision'
        '401':
          description: Unauthenticated
        '403':
          description: Missing tenant context
          inactive membership: null
          or forbidden: null
  /academic-periods:
    get:
      summary: List tenant academic periods
      operationId: listAcademicPeriods
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Academic period page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPeriodPage'
    post:
      summary: Create academic period
      operationId: createAcademicPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicPeriodRequest'
      responses:
        '200':
          description: Academic period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPeriodView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
  /academic-periods/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    put:
      summary: Update academic period with optimistic concurrency
      operationId: updateAcademicPeriod
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcademicPeriodRequest'
      responses:
        '200':
          description: Academic Period
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcademicPeriodView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
        '404':
          description: Academic Period not found in current tenant
  /programs:
    get:
      summary: List tenant programs
      operationId: listPrograms
      parameters:
      - name: academicPeriodId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Program page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramPage'
    post:
      summary: Create program
      operationId: createProgram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramRequest'
      responses:
        '200':
          description: Program
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
  /programs/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    put:
      summary: Update program with optimistic concurrency
      operationId: updateProgram
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgramRequest'
      responses:
        '200':
          description: Program
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgramView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
        '404':
          description: Program not found in current tenant
  /courses:
    get:
      summary: List tenant courses
      operationId: listCourses
      parameters:
      - name: programId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Course page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoursePage'
    post:
      summary: Create course
      operationId: createCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequest'
      responses:
        '200':
          description: Course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
  /courses/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    put:
      summary: Update course with optimistic concurrency
      operationId: updateCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseRequest'
      responses:
        '200':
          description: Course
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
        '404':
          description: Course not found in current tenant
  /subjects:
    get:
      summary: List tenant subjects
      operationId: listSubjects
      parameters:
      - name: courseId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Subject page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectPage'
    post:
      summary: Create subject
      operationId: createSubject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectRequest'
      responses:
        '200':
          description: Subject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
  /subjects/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    put:
      summary: Update subject with optimistic concurrency
      operationId: updateSubject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectRequest'
      responses:
        '200':
          description: Subject
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubjectView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
        '404':
          description: Subject not found in current tenant
  /modules:
    get:
      summary: List tenant curriculum modules
      operationId: listCurriculumModules
      parameters:
      - name: programId
        in: query
        schema:
          type: string
          format: uuid
      - name: courseId
        in: query
        schema:
          type: string
          format: uuid
      - name: subjectId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Curriculum module page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumModulePage'
    post:
      summary: Create curriculum module
      operationId: createCurriculumModule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurriculumModuleRequest'
      responses:
        '200':
          description: Curriculum module
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumModuleView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
  /modules/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    put:
      summary: Update curriculum module with optimistic concurrency
      operationId: updateCurriculumModule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CurriculumModuleRequest'
      responses:
        '200':
          description: Curriculum Module
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurriculumModuleView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
        '404':
          description: Curriculum Module not found in current tenant
  /batches:
    get:
      summary: List tenant batches/cohorts for authorized academic operators
      operationId: listBatches
      parameters:
      - name: academicPeriodId
        in: query
        schema:
          type: string
          format: uuid
      - name: programId
        in: query
        schema:
          type: string
          format: uuid
      - name: courseId
        in: query
        schema:
          type: string
          format: uuid
      - name: branchId
        in: query
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Batch page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchPage'
        '403':
          description: Enrollment-view authority required
    post:
      summary: Create batch/cohort
      operationId: createBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      responses:
        '200':
          description: Batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
  /batches/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    put:
      summary: Update batch with optimistic concurrency
      operationId: updateBatch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
      responses:
        '200':
          description: Batch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
        '404':
          description: Batch not found in current tenant
  /enrollments:
    get:
      summary: List tenant enrollments for authorized academic operators
      operationId: listEnrollments
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Enrollment page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentPage'
        '403':
          description: Enrollment-view authority required
    post:
      summary: Enroll a learner in exactly one program, course, or batch
      operationId: createEnrollment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRequest'
      responses:
        '200':
          description: Enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
  /enrollments/me:
    get:
      summary: List the current member's own enrollments
      operationId: listMyEnrollments
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Self-scoped enrollment page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentPage'
  /enrollments/{id}/status:
    parameters:
    - $ref: '#/components/parameters/Id'
    put:
      summary: Change enrollment lifecycle state with optimistic concurrency
      operationId: changeEnrollmentStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentStatusRequest'
      responses:
        '200':
          description: Enrollment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
        '404':
          description: Enrollment not found in current tenant
  /teacher-assignments:
    get:
      summary: List tenant teaching assignments for authorized academic operators
      operationId: listTeacherAssignments
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Teaching assignment page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherAssignmentPage'
        '403':
          description: Teaching-assignment-view authority required
    post:
      summary: Assign a teacher/evaluator to exactly one academic scope
      operationId: createTeacherAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeacherAssignmentRequest'
      responses:
        '200':
          description: Teaching assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherAssignmentView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
  /teacher-assignments/me:
    get:
      summary: List the current member's own teaching assignments
      operationId: listMyTeacherAssignments
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Self-scoped teaching assignment page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherAssignmentPage'
  /teacher-assignments/{id}/end:
    parameters:
    - $ref: '#/components/parameters/Id'
    post:
      summary: End a teaching assignment with optimistic concurrency
      operationId: endTeacherAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndTeacherAssignmentRequest'
      responses:
        '200':
          description: Teaching assignment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherAssignmentView'
        '400':
          description: Invalid academic request
        '409':
          description: Conflict or concurrent modification
        '404':
          description: Teaching assignment not found in current tenant
  /schedule/series:
    get:
      summary: List schedule series visible to the current management scope
      operationId: listScheduleSeries
      parameters: &id003
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleSeriesPage'
    post:
      summary: Create and materialize a finite schedule series
      operationId: createScheduleSeries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScheduleSeriesRequest'
      responses:
        '200':
          description: Created schedule series
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleCreateResult'
        '400':
          description: Invalid schedule or recurrence
        '403':
          description: Schedule management or override permission required
        '409':
          description: Schedule conflict or concurrent mutation
  /schedule/occurrences:
    get:
      summary: Read the current user or administrator calendar range
      operationId: listScheduleOccurrences
      parameters:
      - name: from
        in: query
        required: true
        schema: &id001
          type: string
          format: date-time
