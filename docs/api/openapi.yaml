components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    PlatformVersion:
      type: object
      required:
      - version
      - releaseStatus
      properties:
        version:
          type: string
        releaseStatus:
          type: string
    PermissionKey:
      type: string
      enum:
      - ORGANIZATION_VIEW
      - ORGANIZATION_MANAGE
      - BRANCHES_VIEW
      - BRANCHES_MANAGE
      - USERS_VIEW
      - USERS_MANAGE
      - ROLES_VIEW
      - ROLES_MANAGE
      - ROLES_ASSIGN
      - SESSIONS_VIEW
      - SESSIONS_MANAGE
      - ACADEMICS_VIEW
      - ACADEMICS_MANAGE
      - CURRICULUM_VIEW
      - CURRICULUM_MANAGE
      - ENROLLMENTS_VIEW
      - ENROLLMENTS_MANAGE
      - TEACHING_ASSIGNMENTS_VIEW
      - TEACHING_ASSIGNMENTS_MANAGE
      - AUDIT_VIEW
      - SCHEDULE_VIEW
      - SCHEDULE_MANAGE
      - SCHEDULE_CONFLICT_OVERRIDE
      - ANNOUNCEMENTS_VIEW
      - ANNOUNCEMENTS_MANAGE
      - NOTIFICATION_OPERATIONS_VIEW
    MembershipStatus:
      type: string
      enum:
      - ACTIVE
      - SUSPENDED
      - ENDED
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - DISABLED
    AssignmentScopeKind:
      type: string
      enum:
      - TENANT
      - BRANCH
    AuthenticationAssurance:
      type: object
      required:
      - acr
      - methods
      - otpEvidence
      - webAuthnEvidence
      - multiFactorEvidence
      properties:
        acr:
          type: string
        methods:
          type: array
          items:
            type: string
        otpEvidence:
          type: boolean
        webAuthnEvidence:
          type: boolean
        multiFactorEvidence:
          type: boolean
    CurrentIdentity:
      type: object
      required:
      - userId
      - membershipId
      - oidcSubject
      - displayName
      - tenantId
      - membershipStatus
      - roles
      - permissions
      - primaryBranchPermissions
      - authenticationAssurance
      properties:
        userId:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        oidcSubject:
          type: string
        email:
          type:
          - string
          - 'null'
          format: email
        displayName:
          type: string
        tenantId:
          type: string
          format: uuid
        membershipStatus:
          $ref: '#/components/schemas/MembershipStatus'
        primaryBranchId:
          type:
          - string
          - 'null'
          format: uuid
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionKey'
        authenticationAssurance:
          $ref: '#/components/schemas/AuthenticationAssurance'
        primaryBranchPermissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionKey'
    ProvisionMembershipRequest:
