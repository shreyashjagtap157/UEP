  /recordings:
    get:
      summary: List recordings visible to the current tenant member
      operationId: listRecordings
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Recording page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingPage'
  /live-classes/{liveClassId}/recordings:
    post:
      summary: Request recording of a live classroom
      operationId: requestRecording
      parameters:
      - name: liveClassId
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingRequest'
      responses:
        '200':
          description: Recording request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingView'
  /recordings/{id}:
    get:
      summary: Read recording processing state
      operationId: getRecording
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Recording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingView'
  /recordings/{id}/stop:
    post:
      summary: Stop an active recording
      operationId: stopRecording
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '202':
          description: Stop requested
  /recordings/{id}/playback:
    post:
      summary: Issue a short-lived authorized playback URL with dynamic watermark identity
      operationId: issueRecordingPlayback
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      responses:
        '200':
          description: Playback authorization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackView'
  /recordings/{id}/stream:
    get:
      summary: Stream an authorized recording asset
      operationId: streamRecording
      security: []
      parameters:
      - name: id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: token
        in: query
        required: true
        schema: {type: string}
      responses:
        '200':
          description: Recording media
          content:
            video/mp4:
              schema: {type: string, format: binary}
  /recording-storage-policy:
    get:
      summary: Read tenant recording storage policy
      operationId: getRecordingStoragePolicy
      responses:
        '200':
          description: Current recording storage policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingStoragePolicyView'
    put:
      summary: Configure recording hot, cache and archive destinations
      operationId: updateRecordingStoragePolicy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordingStoragePolicy'
      responses:
        '200':
          description: Updated recording storage policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordingStoragePolicyView'
  /finance/fees:
    get:
      summary: List institution fees
      responses:
        '200':
          description: Finance fees
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/FeeView'}}}}
    post:
      summary: Create institution fee
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FeeRequest'}}}}
      responses: {'200': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/FeeView'}}}}}
  /finance/fees/{id}:
    put:
      summary: Update institution fee
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/FeeRequest'}}}}
      responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/FeeView'}}}}}
  /finance/invoices:
    get:
      summary: List invoices
      responses: {'200': {description: Invoices, content: {application/json: {schema: {$ref: '#/components/schemas/InvoicePage'}}}}}
    post:
      summary: Create invoice
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CreateInvoiceRequest'}}}}
      responses: {'200': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/InvoiceView'}}}}}
  /finance/invoices/{id}:
    get:
      summary: Get invoice
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Invoice, content: {application/json: {schema: {$ref: '#/components/schemas/InvoiceView'}}}}}
  /finance/invoices/{id}/issue:
    post:
      summary: Issue invoice
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/VersionRequest'}}}}
      responses: {'200': {description: Issued, content: {application/json: {schema: {$ref: '#/components/schemas/InvoiceView'}}}}}
  /finance/invoices/{id}/payments:
    post:
      summary: Capture an invoice payment
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PayRequest'}}}}
      responses: {'200': {description: Captured, content: {application/json: {schema: {$ref: '#/components/schemas/PaymentView'}}}}}
  /commercial/subscription:
    get:
      summary: Get tenant subscription
      responses: {'200': {description: Subscription, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionView'}}}}}
    put:
      summary: Update subscription plan
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/PlanRequest'}}}}
      responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionView'}}}}}
  /commercial/subscription/trial:
    post:
      summary: Start tenant trial
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DaysRequest'}}}}
      responses: {'200': {description: Trial, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionView'}}}}}
  /commercial/subscription/grace:
    post:
      summary: Start grace period
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DaysRequest'}}}}
      responses: {'200': {description: Grace, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionView'}}}}}
  /commercial/subscription/suspend:
    post:
      summary: Suspend subscription
      responses: {'200': {description: Suspended, content: {application/json: {schema: {$ref: '#/components/schemas/SubscriptionView'}}}}}
  /commercial/white-label:
    get:
      summary: Get white-label settings
      responses: {'200': {description: Settings, content: {application/json: {schema: {$ref: '#/components/schemas/WhiteLabelView'}}}}}
    put:
      summary: Update white-label settings
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WhiteLabelRequest'}}}}
      responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/WhiteLabelView'}}}}}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttemptId:
      name: attemptId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AnswerId:
      name: answerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReviewId:
      name: reviewId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    FeeView:
      type: object
      required: [id, name, amount, currency, status, version]
      properties: {id: {type: string, format: uuid}, name: {type: string}, amount: {type: number}, currency: {type: string}, status: {type: string}, version: {type: integer, format: int64}}
    FeeRequest:
      type: object
      required: [name, amount, currency, status, expectedVersion]
      properties: {name: {type: string}, amount: {type: number}, currency: {type: string, minLength: 3, maxLength: 3}, status: {type: string}, expectedVersion: {type: integer, format: int64}}
    InstallmentView:
      type: object
      properties: {id: {type: string, format: uuid}, sequenceNo: {type: integer}, amount: {type: number}, dueOn: {type: string, format: date}, status: {type: string}, version: {type: integer, format: int64}}
    InvoiceView:
      type: object
      properties: {id: {type: string, format: uuid}, membershipId: {type: string, format: uuid}, invoiceNumber: {type: string}, totalAmount: {type: number}, paidAmount: {type: number}, currency: {type: string}, status: {type: string}, issuedOn: {type: string, format: date}, dueOn: {type: string, format: date}, version: {type: integer, format: int64}, installments: {type: array, items: {$ref: '#/components/schemas/InstallmentView'}}}
    CreateInvoiceRequest:
      type: object
      required: [membershipId, totalAmount, currency, dueOn]
      properties: {membershipId: {type: string, format: uuid}, totalAmount: {type: number}, currency: {type: string}, dueOn: {type: string, format: date}, installments: {type: array, items: {$ref: '#/components/schemas/InstallmentRequest'}}}
    InstallmentRequest:
      type: object
      properties: {amount: {type: number}, dueOn: {type: string, format: date}}
    PaymentView:
      type: object
      properties: {id: {type: string, format: uuid}, invoiceId: {type: string, format: uuid}, amount: {type: number}, currency: {type: string}, provider: {type: string}, providerReference: {type: string}, status: {type: string}, capturedAt: {type: string, format: date-time}, receipt: {type: object}}
    PayRequest:
      type: object
      required: [amount, currency]
      properties: {amount: {type: number}, currency: {type: string}}
    VersionRequest:
      type: object
      required: [expectedVersion]
      properties: {expectedVersion: {type: integer, format: int64}}
    InvoicePage:
      type: object
      properties: {items: {type: array, items: {$ref: '#/components/schemas/InvoiceView'}}, page: {type: integer}, size: {type: integer}, totalElements: {type: integer, format: int64}}
    SubscriptionView:
      type: object
      properties: {tenantId: {type: string, format: uuid}, status: {type: string}, planCode: {type: string}, recurringAmount: {type: number}, currency: {type: string}, autoRenew: {type: boolean}, startsAt: {type: string, format: date-time}, graceEndsAt: {type: string, format: date-time}, expiresAt: {type: string, format: date-time}, trialEndsAt: {type: string, format: date-time}, authorityKind: {type: string}, externalLicenseId: {type: string}, licenseRevision: {type: integer, format: int64}}
    PlanRequest:
      type: object
      required: [planCode, recurringAmount, currency, expectedVersion]
      properties: {planCode: {type: string}, recurringAmount: {type: number}, currency: {type: string}, autoRenew: {type: boolean}, expectedVersion: {type: integer, format: int64}}
    DaysRequest:
      type: object
      required: [days]
      properties: {days: {type: integer, minimum: 1, maximum: 365}}
    WhiteLabelView:
      type: object
      properties: {tenantId: {type: string, format: uuid}, brandName: {type: string}, primaryColor: {type: string}, logoUrl: {type: string}, faviconUrl: {type: string}, customDomain: {type: string}, enabled: {type: boolean}, version: {type: integer, format: int64}}
    WhiteLabelRequest:
      type: object
      required: [brandName, expectedVersion]
      properties: {brandName: {type: string}, primaryColor: {type: string}, logoUrl: {type: string}, faviconUrl: {type: string}, customDomain: {type: string}, enabled: {type: boolean}, expectedVersion: {type: integer, format: int64}}
    PlatformVersion:
      type: object
      required:
      - version
      - releaseStatus
      properties:
        version:
          type: string
        releaseStatus:
          type: string
    PermissionKey:
      type: string
      enum:
      - ORGANIZATION_VIEW
      - ORGANIZATION_MANAGE
      - BRANCHES_VIEW
      - BRANCHES_MANAGE
      - USERS_VIEW
      - USERS_MANAGE
      - ROLES_VIEW
      - ROLES_MANAGE
      - ROLES_ASSIGN
      - SESSIONS_VIEW
      - SESSIONS_MANAGE
      - ACADEMICS_VIEW
      - ACADEMICS_MANAGE
      - CURRICULUM_VIEW
      - CURRICULUM_MANAGE
      - ENROLLMENTS_VIEW
      - ENROLLMENTS_MANAGE
      - TEACHING_ASSIGNMENTS_VIEW
      - TEACHING_ASSIGNMENTS_MANAGE
      - AUDIT_VIEW
      - SCHEDULE_VIEW
      - SCHEDULE_MANAGE
      - SCHEDULE_CONFLICT_OVERRIDE
      - ANNOUNCEMENTS_VIEW
      - ANNOUNCEMENTS_MANAGE
      - NOTIFICATION_OPERATIONS_VIEW
      - CONTENT_VIEW
      - CONTENT_MANAGE
      - ASSESSMENTS_VIEW
      - ASSESSMENTS_MANAGE
      - ASSESSMENTS_TAKE
      - GRADING_VIEW
      - GRADING_MANAGE
      - REVIEW_VIEW
      - REVIEW_SUBMIT
      - REVIEW_MANAGE
      - ASSIGNMENTS_VIEW
      - ASSIGNMENTS_MANAGE
      - ASSIGNMENTS_TAKE
      - GRADEBOOK_VIEW
      - GRADEBOOK_MANAGE
      - LIVE_CLASS_VIEW
      - LIVE_CLASS_MANAGE
      - LIVE_CLASS_MODERATE
      - LIVE_CLASS_CHAT
      - PRESENCE_VIEW
      - PRESENCE_MANAGE
      - ATTENDANCE_VIEW
      - ATTENDANCE_MANAGE
      - RECORDINGS_VIEW
      - RECORDINGS_MANAGE
      - FINANCE_VIEW
      - FINANCE_MANAGE
      - COMMERCIAL_VIEW
      - COMMERCIAL_MANAGE
      - PAYMENTS_MANAGE
    RecordingQualityPreset:
      type: string
      enum: [ECONOMY, BALANCED, HIGH_QUALITY, SOURCE_ARCHIVE]
    RecordingProcessingStatus:
      type: string
      enum: [REQUESTED, STARTING, RECORDING, FINALIZING, READY, ARCHIVING, ARCHIVED, FAILED, DELETED]
    RecordingStorageTier:
      type: string
      enum: [HOT, CACHE, ARCHIVE]
    RecordingView:
      type: object
      required: [id, liveClassId, classSessionId, qualityPreset, status, storageTier, storageProvider, requestedAt, version]
      properties:
        id: {type: string, format: uuid}
        liveClassId: {type: string, format: uuid}
        classSessionId: {type: string, format: uuid}
        qualityPreset: {$ref: '#/components/schemas/RecordingQualityPreset'}
        status: {$ref: '#/components/schemas/RecordingProcessingStatus'}
        storageTier: {$ref: '#/components/schemas/RecordingStorageTier'}
        storageProvider: {type: string, enum: [LOCAL, S3_COMPATIBLE, GOOGLE_DRIVE, GOOGLE_SHARED_DRIVE]}
        sizeBytes: {type: integer, format: int64}
        durationSeconds: {type: integer, format: int64}
        requestedAt: {type: string, format: date-time}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        readyAt: {type: string, format: date-time}
        archivedAt: {type: string, format: date-time}
        failureReason: {type: string}
        version: {type: integer, format: int64}
    RecordingPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/RecordingView'}}
        page: {type: integer}
        size: {type: integer}
        totalElements: {type: integer, format: int64}
        totalPages: {type: integer}
    RecordingRequest:
      type: object
      required: [qualityPreset]
      properties:
        qualityPreset: {$ref: '#/components/schemas/RecordingQualityPreset'}
    PlaybackView:
      type: object
      required: [streamUrl, expiresAt, watermarkName, watermarkId, issuedAt]
      properties:
        streamUrl: {type: string}
        expiresAt: {type: string, format: date-time}
        watermarkName: {type: string}
        watermarkId: {type: string}
        issuedAt: {type: string, format: date-time}
    RecordingStoragePolicy:
      type: object
      required: [hotCacheDays, cacheDays, hotProvider, cacheProvider, archiveProvider, deletedObjectGraceDays, expectedVersion]
      properties:
        hotCacheDays: {type: integer, minimum: 0}
        cacheDays: {type: integer, minimum: 0}
        retentionDays: {type: integer, minimum: 1}
        hotProvider: {type: string, enum: [LOCAL, S3_COMPATIBLE, GOOGLE_DRIVE, GOOGLE_SHARED_DRIVE]}
        cacheProvider: {type: string, enum: [LOCAL, S3_COMPATIBLE, GOOGLE_DRIVE, GOOGLE_SHARED_DRIVE]}
        archiveProvider: {type: string, enum: [LOCAL, S3_COMPATIBLE, GOOGLE_DRIVE, GOOGLE_SHARED_DRIVE]}
        deletedObjectGraceDays: {type: integer, minimum: 0}
        expectedVersion: {type: integer, format: int64}
    RecordingStoragePolicyView:
      type: object
      required: [hotCacheDays, cacheDays, hotProvider, cacheProvider, archiveProvider, deletedObjectGraceDays, version]
      properties:
        hotCacheDays: {type: integer, minimum: 0}
        cacheDays: {type: integer, minimum: 0}
        retentionDays: {type: integer, minimum: 1}
        hotProvider: {type: string, enum: [LOCAL, S3_COMPATIBLE, GOOGLE_DRIVE, GOOGLE_SHARED_DRIVE]}
        cacheProvider: {type: string, enum: [LOCAL, S3_COMPATIBLE, GOOGLE_DRIVE, GOOGLE_SHARED_DRIVE]}
        archiveProvider: {type: string, enum: [LOCAL, S3_COMPATIBLE, GOOGLE_DRIVE, GOOGLE_SHARED_DRIVE]}
        deletedObjectGraceDays: {type: integer, minimum: 0}
        version: {type: integer, format: int64}

    LiveClassView:
      type: object
      required: [id, classSessionId, batchId, roomName, status, attendancePolicy, minimumAttendanceSeconds, attendanceThresholdBasisPoints, lowBandwidth, chatEnabled, version]
      properties:
        id: {type: string, format: uuid}
        classSessionId: {type: string, format: uuid}
        batchId: {type: string, format: uuid}
        roomName: {type: string}
        status: {$ref: '#/components/schemas/LiveClassStatus'}
        attendancePolicy: {type: string, enum: [MANUAL, JOIN_TIME, MINIMUM_DURATION, PERCENTAGE]}
        minimumAttendanceSeconds: {type: integer, minimum: 0}
        attendanceThresholdBasisPoints: {type: integer, minimum: 0, maximum: 10000}
        lowBandwidth: {type: boolean}
        chatEnabled: {type: boolean}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        version: {type: integer, minimum: 0}
    LiveClassToken:
      type: object
      required: [serverUrl, participantToken, liveClassId, roomName, role, lowBandwidth, chatEnabled]
      properties:
        serverUrl: {type: string, format: uri}
        participantToken: {type: string}
        liveClassId: {type: string, format: uuid}
        roomName: {type: string}
        role: {$ref: '#/components/schemas/ParticipantRole'}
        lowBandwidth: {type: boolean}
        chatEnabled: {type: boolean}
    LiveParticipant:
      type: object
      required: [membershipId, role, status, totalPresentSeconds, version]
      properties:
        membershipId: {type: string, format: uuid}
        role: {$ref: '#/components/schemas/ParticipantRole'}
        status: {type: string, enum: [INVITED, JOINED, LEFT, MUTED, KICKED, BLOCKED]}
        joinedAt: {type: string, format: date-time}
        leftAt: {type: string, format: date-time}
        totalPresentSeconds: {type: integer, minimum: 0}
        clientProfile: {type: string}
        moderationReason: {type: string}
        version: {type: integer, minimum: 0}
    AttendanceView:
      type: object
      required: [membershipId, status, presentSeconds, finalizedAt, source]
      properties:
        membershipId: {type: string, format: uuid}
        status: {type: string, enum: [PRESENT, PARTIAL, ABSENT, EXCUSED]}
        presentSeconds: {type: integer, minimum: 0}
        finalizedAt: {type: string, format: date-time}
        source: {type: string, enum: [AUTO, MANUAL]}
        notes: {type: string}
    SetAttendanceRequest:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [PRESENT, PARTIAL, ABSENT, EXCUSED]}
        notes: {type: string, maxLength: 500}
    LiveClassPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LiveClassView'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    ParticipantPage:
      type: object
      required: [items, page, size, totalElements, totalPages]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/LiveParticipant'}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalElements: {type: integer, minimum: 0}
        totalPages: {type: integer, minimum: 0}
    CreateLiveClassRequest:
      type: object
      required: [classSessionId]
      properties:
        classSessionId: { type: string, format: uuid }
        attendancePolicy: { type: string, enum: [MANUAL, JOIN_TIME, MINIMUM_DURATION, PERCENTAGE] }
        minimumAttendanceSeconds: { type: integer, minimum: 0, maximum: 86400 }
        attendanceThresholdBasisPoints: { type: integer, minimum: 0, maximum: 10000 }
        lowBandwidth: { type: boolean }
        chatEnabled: { type: boolean }
    LiveClassStatus:
      type: string
      enum: [SCHEDULED, LIVE, ENDED, CANCELLED]
    ParticipantRole:
      type: string
      enum: [HOST, MODERATOR, PRESENTER, PARTICIPANT, OBSERVER]
    MembershipStatus:
      type: string
      enum:
      - ACTIVE
      - SUSPENDED
      - ENDED
    UserStatus:
      type: string
      enum:
      - ACTIVE
      - DISABLED
    AssignmentScopeKind:
      type: string
      enum:
      - TENANT
      - BRANCH
    AuthenticationAssurance:
      type: object
      required:
      - acr
      - methods
      - otpEvidence
      - webAuthnEvidence
      - multiFactorEvidence
      properties:
        acr:
          type: string
        methods:
          type: array
          items:
            type: string
        otpEvidence:
          type: boolean
        webAuthnEvidence:
          type: boolean
        multiFactorEvidence:
          type: boolean
    CurrentIdentity:
      type: object
      required:
      - userId
      - membershipId
      - oidcSubject
      - displayName
      - tenantId
      - membershipStatus
      - roles
      - permissions
      - primaryBranchPermissions
      - authenticationAssurance
      properties:
        userId:
          type: string
          format: uuid
        membershipId:
          type: string
          format: uuid
        oidcSubject:
          type: string
        email:
          type:
          - string
          - 'null'
          format: email
        displayName:
          type: string
        tenantId:
          type: string
          format: uuid
        membershipStatus:
          $ref: '#/components/schemas/MembershipStatus'
        primaryBranchId:
          type:
          - string
          - 'null'
          format: uuid
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionKey'
        authenticationAssurance:
          $ref: '#/components/schemas/AuthenticationAssurance'
        primaryBranchPermissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionKey'
    ProvisionMembershipRequest:
      type: object
      required:
      - subject
      - displayName
      properties:
        subject:
          type: string
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          maxLength: 200
        primaryBranchId:
          type: string
          format: uuid
        externalReference:
          type: string
          maxLength: 160
        roleIds:
          type: array
          items:
            type: string
            format: uuid
    UpdateMembershipRequest:
      type: object
      required:
      - status
      - expectedVersion
      properties:
        status:
          $ref: '#/components/schemas/MembershipStatus'
        primaryBranchId:
          type:
          - string
          - 'null'
          format: uuid
        externalReference:
          type:
          - string
