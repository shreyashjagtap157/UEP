          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 320
        displayName:
          type: string
          maxLength: 200
        primaryBranchId:
          type: string
          format: uuid
        externalReference:
          type: string
          maxLength: 160
        roleIds:
