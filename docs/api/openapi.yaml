openapi: 3.1.0
info:
  title: Universal Education Platform API
  version: 0.1.0.0-SNAPSHOT
  description: Web-first platform API foundation.
servers:
  - url: /api/v1
paths:
  /platform/version:
    get:
      summary: Read platform build/version information
      operationId: getPlatformVersion
      responses:
        '200':
          description: Platform version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlatformVersion'
  /licensing/entitlements/{feature}/decision:
    get:
      summary: Resolve the current tenant entitlement decision
      operationId: getEntitlementDecision
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: feature
          required: true
          schema:
            $ref: '#/components/schemas/FeatureKey'
      responses:
        '200':
          description: Current decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntitlementDecision'
        '401': { description: Unauthenticated }
        '403': { description: Missing tenant context or forbidden }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PlatformVersion:
      type: object
      required: [version, releaseStatus]
      properties:
        version: { type: string }
        releaseStatus: { type: string }
    FeatureKey:
      type: string
      enum: [LIVE_CLASS, RECORDING, ASSESSMENTS, AUTO_GRADING, ADVANCED_REVIEW, ASSIGNMENTS, PAYMENTS, CERTIFICATES, API, WHITE_LABEL, SSO, AI]
    EntitlementDecision:
      type: object
      required: [feature, allowed, reason]
      properties:
        feature: { $ref: '#/components/schemas/FeatureKey' }
        allowed: { type: boolean }
        reason: { type: string }
