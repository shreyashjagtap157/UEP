name: universal-education-platform
services:
  postgres:
    image: postgres:17.11
    environment:
      POSTGRES_DB: education_platform
      POSTGRES_USER: education
      POSTGRES_PASSWORD: education
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U education -d education_platform"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--http-host=0.0.0.0", "--http-port=8080", "--hostname=http://localhost:8081", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME:?Set KC_BOOTSTRAP_ADMIN_USERNAME in the local environment}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD:?Set KC_BOOTSTRAP_ADMIN_PASSWORD in the local environment}
      UEP_LOCAL_KEYCLOAK_OWNER_PASSWORD: ${UEP_LOCAL_KEYCLOAK_OWNER_PASSWORD:?Set UEP_LOCAL_KEYCLOAK_OWNER_PASSWORD in the local environment}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak/education-realm.json:/opt/keycloak/data/import/education-realm.json:ro

  livekit:
    image: livekit/livekit-server:v1.13.6
    command: ["--dev", "--bind", "0.0.0.0"]
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  valkey:
    image: valkey/valkey:9.1.1-alpine
    ports:
      - "6379:6379"

  livekit-egress:
    image: livekit/egress:v1.13.0
    depends_on:
      - livekit
      - valkey
    environment:
      EGRESS_CONFIG: /etc/livekit/egress.yaml
    command: ["/livekit/egress", "--config", "/etc/livekit/egress.yaml"]
    volumes:
      - ./livekit/egress.yaml:/etc/livekit/egress.yaml:ro
      - ./var/recordings:/recordings

volumes:
  postgres-data:
  keycloak-data:
