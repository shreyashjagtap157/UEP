# UEP staging Keycloak — OIDC issuer for the Cloudflare Pages frontend and Spring API.
# Start/reuse this app only after inspecting the live Fly account and approving its regional cost.
app = 'uep-keycloak-testing'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  KC_DB = 'postgres'
  KC_DB_SCHEMA = 'keycloak'
  KC_DB_USERNAME = 'uep_keycloak'
  KC_HOSTNAME = 'https://uep-keycloak-testing.fly.dev'
  KC_HOSTNAME_STRICT = 'true'
  KC_HOSTNAME_STRICT_HTTPS = 'true'
  KC_HTTP_ENABLED = 'true'
  KC_HTTP_PORT = '8080'
  KC_HTTP_MANAGEMENT_PORT = '9000'
  KC_PROXY_HEADERS = 'xforwarded'
  KC_HEALTH_ENABLED = 'true'
  KC_METRICS_ENABLED = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[checks]]
  grace_period = '90s'
  interval = '15s'
  method = 'GET'
  path = '/health/ready'
  port = 9000
  timeout = '5s'
  type = 'http'

[[vm]]
  memory = '2048mb'
  cpu_kind = 'shared'
  cpus = 2
